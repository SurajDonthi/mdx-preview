name: CI

on:
  push:
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. The lockfile only carries Windows native binaries
        # (rollup, esbuild, lightningcss, @tailwindcss/oxide) if it was generated
        # with every platform's optional dependencies resolved - and a
        # Linux-only matrix is exactly what hid that being missing.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Keys the ~/.npm cache off package-lock.json.
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run
